# Reviewed machine-learning feature allowlist -- prior-only ablation.
#
# A named experiment, not a replacement for the champion contract. It
# admits only features computed strictly from events before the anchor, so
# a run against it answers 'how much of the signal is in the history alone'
# without the anchor event's own fields or a fitted baseline.
#
# It carries a different allowlist_id and therefore a different
# fingerprint. A champion lock records the eligible-feature fingerprint it
# was frozen under, so an ablation can never quietly become the champion's
# feature contract: the mismatched digest is rejected.

allowlist_schema_version: "1.0.0"
allowlist_id: prior_only_ablation
allowlist_version: "1.0.0"
required_feature_schema_version: "1.0.0"

compatible_feature_catalog_fingerprints:
  - 81d037758c87c86b11dd27d23542281b1e193deedf8ef8c326524d7f5b40653a
  - 3c6ec28a0e71f43f8dd1e2896c454e6ffa77161c87ef6e73271a0e69a3dffa8f

governed_leakage_classes:
  - prior_only

