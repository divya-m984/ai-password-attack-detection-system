# Machine-learning configuration for the containerized demonstration.
#
# Sized for configs/data/synthetic-demo.yaml -- about four thousand feature rows
# over four hours, of which roughly 1 500 train and 600 validate -- and for
# nothing else. It sits between the two
# configurations that already exist and replaces neither:
#
#   model-testing.yaml       floors of 1 row, because a contract test asserts
#                            mechanics and must not fail on a statistical
#                            impossibility. Too loose to deploy under.
#   model-development.yaml   floors sized for the 30-day dataset. Running it
#                            here would trip every one of them, which is the
#                            intended behaviour rather than a fault.
#
# WHAT THE FLOORS BELOW MEAN. They are demonstration floors: large enough that
# a fitted quantity has some support behind it, small enough that a four-hour
# stream can meet them. They are NOT research floors, and no metric this
# deployment reports is a performance claim about this system. docs/docker.md
# says the same thing where somebody reading a dashboard might need it.
#
# The *policy* fields are identical to the development configuration, and that
# is the part that must not vary: calibration still reads validation-A,
# threshold selection still reads validation-B, missingness indicators are
# still on, resampling is still off, and the enum those partitions come from
# has no test member. A demonstration configuration that relaxed a discipline
# would let a container demonstrate a pipeline the project does not run.

ml_schema_version: "1.0.0"
required_feature_schema_version: "1.0.0"
model_catalog_version: "1.0.0"

# One seed governs every stochastic estimator in the run, and it is recorded in
# every model manifest. Distinct from the dataset's seed so the two cannot be
# confused for one another in a fingerprint.
seed: 909

# The reviewed column M-001 thresholds -- the same one both other
# configurations name. Chosen for what it means and never for how it scored:
# prior-only, post-event, non-nullable, and the most direct expression of the
# pattern this system exists to detect.
single_feature_baseline_column: user_failure_count__5m

# The same three families the serving integration fixture trains. The tree
# families are excluded deliberately: fitting a forest is the slowest thing
# this layer does, and a container's one-shot preparation step is the wrong
# place to spend a minute proving something the development configuration
# already covers.
enabled_model_families:
  - prior_baseline
  - single_feature_threshold
  - logistic_regression

family_hyperparameters:
  logistic_regression:
    c_inverse_regularization: 1.0
    max_iter: 500
    class_weight: balanced

preprocessing:
  statistics_source: train
  numeric_imputation: median
  add_missing_indicators: true
  categorical_encoding: one_hot
  # current_country_code is the only high-cardinality categorical column in the
  # feature set, and this dataset's source population publishes fourteen of
  # them. The ceiling is set above that with room to spare; the frequency floor
  # is what actually keeps the encoded width from tracking dataset size.
  min_category_frequency: 5
  max_category_cardinality: 32
  standardize_numeric_for_linear_models: true
  # prior_only and current_event_context, and deliberately NOT baseline_derived.
  #
  # This is the one place this configuration departs from the development one,
  # and the reason is a train/serve skew rather than a preference. The serving
  # path builds its feature engine with no fitted behavioural baseline (see
  # docs/docker.md and docs/api.md §12), so every baseline-derived column is
  # null or False on every live request. A model trained on those columns would
  # be reading, at serving time, a constant that meant something else entirely
  # during training -- and it would express that as confident nonsense rather
  # than as an error. Training on the classes the serving path can actually
  # compute is what keeps the demonstration's ML layer honest.
  #
  # If the baseline is ever added to the serving bundle, this list should grow
  # to match the development configuration's, and not before.
  include_leakage_classes:
    - prior_only
    - current_event_context

imbalance:
  class_weight_policy: balanced
  computed_from: train
  resampling: none

validation_partition:
  strategy: campaign_group_boundary
  grouping_column: campaign_id
  boundary_placement: first_group_boundary_at_or_after_target
  ungrouped_row_policy: singleton_by_event_time
  target_partition_a_fraction: 0.5
  min_partition_rows: 50
  min_partition_positive_rows: 5

calibration:
  # Platt rather than isotonic. A four-hour validation-A partition carries a
  # few hundred rows, and a monotone piecewise fit over that many distinct
  # scores is closer to a lookup table than to a calibration.
  method: platt
  source_partition: validation_a
  max_expected_calibration_error: 0.25
  reliability_bin_count: 5
  min_calibration_rows: 100
  min_reliability_bin_rows: 10
  min_isotonic_distinct_scores: 10
  platt_max_iter: 1000
  platt_tolerance: 1.0e-8
  require_calibration_for_probability_terminology: true

thresholds:
  objective: max_recall_at_max_fpr
  source_partition: validation_b
  # Development's 1% ceiling, kept rather than loosened. Validation-B carries a
  # few hundred benign rows here, which is enough for a 1% ceiling to mean
  # something; loosening it changed no observed replay outcome when it was
  # tried, so the tighter and more defensible value is the one that stayed.
  max_false_positive_rate: 0.01
  min_detection_rate: 0.30
  search_grid_size: 200
  tie_break: lowest_threshold

category:
  enabled: true
  fit_on: train_known_malicious
  class_order: sorted_scenario_value
  min_category_score: 0.35
  min_rows_per_category: 5
  selection_partition: validation_b
  abstention_objective: max_coverage_at_min_precision
  min_known_category_precision: 0.60
  min_known_malicious_rows: 30
  abstention_search_grid_size: 200
  abstention_tie_break: lowest_threshold
  report_conditional_metrics: true
  report_cascade_metrics: true

anomaly:
  # Off: no anomaly-capable family is enabled above, and an enabled probe
  # without one is a configuration error by design.
  enabled: false
  fit_on: train_benign
  threshold_method: train_benign_quantile
  threshold_partition: validation_a
  quantile: 0.99
  target_benign_flag_rate: 0.01
  min_fit_rows: 100
  influences_champion_selection: false

support:
  min_train_positive_rows: 25
  min_validation_positive_rows: 10
  min_validation_benign_rows: 50
  min_rows_per_category: 5

gates:
  baseline_family: prior_baseline
  # Zero rather than development's 0.05. On a stream this short the difference
  # between two candidates' PR-AUC is within the noise of which campaigns fell
  # on which side of a boundary, so requiring a margin here would be requiring
  # a measurement the dataset cannot make. A candidate still has to be no worse
  # than the baseline to be promoted.
  min_pr_auc_gain_over_baseline: 0.0
  max_false_positive_rate: 0.01
  min_detection_rate: 0.30
  max_expected_calibration_error: 0.25
  require_serializer_parity: true
  require_determinism: true
  require_eligibility_audit_pass: true
  parity_tolerance: 1.0e-12

fusion:
  enabled: true
  # All three strategies are built and compared. Which one wins is an outcome
  # of this configuration meeting this dataset; it is not declared here, and
  # the container reports whichever the run selected.
  strategies:
    - or_gate
    - and_gate
    - stacked
  selection_partition: validation_b
  stacked_max_iter: 1000

explain:
  enabled: true
  partition: validation_a
  top_k_features: 10
  permutation_repeats: 3
  max_local_explanations: 0
  include_feature_values: false

drift:
  enabled: true
  reference_source: train
  quantile_count: 10
  psi_warn_threshold: 0.10
  psi_alert_threshold: 0.25
  min_reference_rows: 100

overwrite: true
