# Reviewed machine-learning feature allowlist -- champion contract.
#
# A Phase 3 catalog feature is inert to the ML layer until it appears in
# this file. Adding a feature to the catalog does NOT add it to any model:
# it makes the NO_UNREVIEWED_CATALOG_FEATURE audit check fail by name,
# which forces an explicit decision here or an entry under pending_review.
#
# Every entry is checked against the executable catalog when it is loaded.
# A leakage class, feature group, or decision point recorded here that
# disagrees with the catalog is refused rather than reconciled -- the two
# would be describing different systems.
#
# The key columns (anchor_event_id, anchor_event_time,
# feature_schema_version) are absent by construction: they are join and
# provenance columns and are never model inputs.
#
# Regenerate a draft with:
#   uv run password-attack-detector ml catalog --emit-allowlist <path>
# then review it. Do not commit a generated file unreviewed.

allowlist_schema_version: "1.0.0"
allowlist_id: champion
allowlist_version: "1.0.0"
required_feature_schema_version: "1.0.0"

