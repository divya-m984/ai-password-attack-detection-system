[project]
name = "password-attack-detector"
version = "0.2.0"
description = "AI-powered defensive system for detecting password-based attacks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "structlog>=24.0",
    "typer>=0.12",
]

[project.scripts]
password-attack-detector = "password_attack_detector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/password_attack_detector"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=3.0.3.260530",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/password_attack_detector --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/password_attack_detector"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["password_attack_detector"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
